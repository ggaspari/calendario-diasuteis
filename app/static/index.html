<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário de Dias Úteis</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #8a92a3; --line: #e3e6ec;
    --feriado: #d6453d; --feriado-bg: #fdecea;
    --quinto: #1f6feb; --decimo: #8a3ffc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 20px 16px; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap;
           gap: 12px 24px; align-items: center; }
  h1 { font-size: 1.4rem; margin: 0; flex: 1 1 100%; }
  .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .controles input[type=number] { width: 90px; padding: 6px 8px; font-size: 1rem; }
  button { padding: 6px 12px; font-size: .95rem; cursor: pointer; }
  .legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: .85rem; color: var(--muted); }
  .legenda span::before { content: ""; display: inline-block; width: 12px; height: 12px;
                          border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .l-fer::before { background: var(--feriado-bg); border: 1px solid var(--feriado); }
  .l-5::before { background: var(--quinto); }
  .l-10::before { background: var(--decimo); }
  .l-fds::before { background: var(--line); }
  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 32px; }
  .resumo { margin: 0 0 16px; color: var(--muted); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .mes { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .mes h2 { font-size: 1rem; margin: 0 0 2px; display: flex; justify-content: space-between; }
  .mes .uteis { color: var(--quinto); font-weight: 600; font-size: .9rem; }
  .mes .marcos { font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
  .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: .85rem; }
  .dias .cab { font-size: .7rem; color: var(--muted); padding-bottom: 4px; }
  .d { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px;
       position: relative; }
  .d.fds { color: var(--muted); background: #f1f2f5; }
  .d.fer { color: var(--feriado); background: var(--feriado-bg); font-weight: 600; cursor: help; }
  .d.q5 { background: var(--quinto); color: #fff; font-weight: 700; }
  .d.q10 { background: var(--decimo); color: #fff; font-weight: 700; }
  .d.q5, .d.q10 { flex-direction: column; line-height: 1; }
  .d.q5::after, .d.q10::after { font-size: .55em; font-weight: 600; margin-top: 1px; }
  .d.q5::after { content: "5º"; } .d.q10::after { content: "10º"; }
  .feriados { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .feriados h2 { font-size: 1rem; margin: 0 0 8px; }
  .feriados ul { margin: 0; padding-left: 18px; columns: 2 240px; font-size: .9rem; }
  .erro { color: var(--feriado); }
  /* Impressão: ano inteiro em uma folha A4 retrato (3 colunas x 4 fileiras). */
  @page { size: A4 portrait; margin: 10mm; }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html { font-size: 9pt; }
    body { background: #fff; }
    .controles { display: none; }
    header { padding: 0 0 3mm; max-width: none; gap: 2mm 6mm; }
    h1 { font-size: 14pt; flex: none; }
    .legenda { font-size: 8pt; gap: 4mm; }
    main { padding: 0; max-width: none; }
    .resumo { margin: 0 0 3mm; font-size: 8pt; }
    .grade { grid-template-columns: repeat(3, 1fr); gap: 3mm; }
    .mes { padding: 2mm 3mm; border-radius: 2mm; break-inside: avoid; }
    .mes h2 { font-size: 10pt; }
    .mes .uteis { font-size: 8.5pt; }
    .mes .marcos { font-size: 7pt; margin-bottom: 1mm; }
    .dias { font-size: 8pt; gap: .6mm; }
    .dias .cab { font-size: 6.5pt; padding-bottom: .5mm; }
    .d { aspect-ratio: auto; height: 5.2mm; border-radius: 1.2mm; }
    .feriados { margin-top: 3mm; padding: 2mm 4mm; border-radius: 2mm; break-inside: avoid; }
    .feriados h2 { font-size: 9pt; margin-bottom: 1mm; }
    .feriados ul { columns: 3; font-size: 7.5pt; }
  }
</style>
</head>
<body>
<header>
  <h1>Calendário de Dias Úteis <span id="titulo-ano"></span></h1>
  <div class="controles">
    <button id="ant" aria-label="Ano anterior">◀</button>
    <input type="number" id="ano" min="1900" max="2200">
    <button id="prox" aria-label="Próximo ano">▶</button>
    <label><input type="checkbox" id="carnaval"> Carnaval</label>
    <label><input type="checkbox" id="corpus"> Corpus Christi</label>
    <button onclick="window.print()">Imprimir</button>
  </div>
  <div class="legenda">
    <span class="l-5">5º dia útil</span><span class="l-10">10º dia útil</span>
    <span class="l-fer">Feriado</span><span class="l-fds">Fim de semana</span>
  </div>
</header>
<main>
  <p class="resumo" id="resumo"></p>
  <div class="grade" id="grade"></div>
  <section class="feriados"><h2>Feriados considerados</h2><ul id="lista"></ul></section>
</main>
<script>
const $ = id => document.getElementById(id);
const SEMANA = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];

async function carregar() {
  const ano = $("ano").value;
  const qs = new URLSearchParams({ ano, carnaval: $("carnaval").checked ? 1 : 0,
                                   corpus_christi: $("corpus").checked ? 1 : 0 });
  history.replaceState(null, "", "?" + qs);
  const r = await fetch("/api/calendario?" + qs);
  const dados = await r.json();
  if (!r.ok) { $("grade").innerHTML = `<p class="erro">${dados.erro}</p>`; return; }
  render(dados);
}

function render(dados) {
  $("titulo-ano").textContent = dados.ano;
  $("resumo").textContent = `${dados.total_dias_uteis} dias úteis no ano.`;
  $("grade").innerHTML = dados.meses.map(m => {
    const vazios = '<div></div>'.repeat(m.dias[0].dia_semana);
    const dias = m.dias.map(d => {
      const cls = ["d"];
      if (d.feriado) cls.push("fer"); else if (d.fim_de_semana) cls.push("fds");
      if (d.ordem_util === 5) cls.push("q5");
      if (d.ordem_util === 10) cls.push("q10");
      const tip = d.feriado ? ` title="${d.feriado}"`
                : d.ordem_util ? ` title="${d.ordem_util}º dia útil"` : "";
      return `<div class="${cls.join(" ")}"${tip}>${d.dia}</div>`;
    }).join("");
    return `<article class="mes">
      <h2>${m.nome}<span class="uteis">${m.dias_uteis} dias úteis</span></h2>
      <div class="marcos">5º dia útil: ${m.quinto_dia_util} · 10º dia útil: ${m.decimo_dia_util}</div>
      <div class="dias">${SEMANA.map(s => `<div class="cab">${s}</div>`).join("")}${vazios}${dias}</div>
    </article>`;
  }).join("");
  $("lista").innerHTML = dados.feriados.map(f => {
    const [a, mo, d] = f.data.split("-");
    return `<li>${d}/${mo} — ${f.nome}</li>`;
  }).join("");
}

const params = new URLSearchParams(location.search);
$("ano").value = params.get("ano") || new Date().getFullYear();
$("carnaval").checked = params.get("carnaval") === "1";
$("corpus").checked = params.get("corpus_christi") === "1";
$("ant").onclick = () => { $("ano").value--; carregar(); };
$("prox").onclick = () => { $("ano").value++; carregar(); };
["ano", "carnaval", "corpus"].forEach(id => $(id).addEventListener("change", carregar));
carregar();
</script>
</body>
</html>
